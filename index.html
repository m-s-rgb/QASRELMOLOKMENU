<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو مطعم قصر الملوك - Qasr Al-Molouk Menu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #FFF8E7;
            color: #2C1810;
        }
        .royal-brown { background-color: #2C1810; }
        .royal-gold { color: #FFD700; }
        .royal-gold-bg { background-color: #FFD700; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="royal-brown text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center text-center sm:text-right gap-2">
            <div>
                <h1 class="text-2xl font-black royal-gold flex items-center justify-center sm:justify-start gap-2">
                    <span>👑</span> مطعم قصر الملوك
                </h1>
                <p class="text-xs text-amber-100">طعم ملكي بمذاق مختلف</p>
            </div>
            <div class="flex items-center gap-2 text-sm text-amber-200">
                <span>📍 ميدان الزلابية بجوار ستوديو شمس</span>
            </div>
        </div>
    </header>

    <!-- Main Content: Images stacked vertically -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full flex flex-col gap-6">
        <div class="text-center mb-2">
            <h2 class="text-xl font-black text-[#2C1810]">قائمة المنيو الكاملة</h2>
            <p class="text-sm text-stone-600">انقر على أي صورة لتكبيرها واستعراض التفاصيل بدقة</p>
        </div>

        <!-- Menu Image 1 -->
        <div class="bg-white rounded-2xl shadow-xl p-4 border border-amber-200 text-center relative overflow-hidden">
            <h3 class="text-lg font-bold text-[#5C3A21] mb-2">صفحة المنيو (1) - الإيطالي والوجبات</h3>
            <img src="menu1.jpg"
                 alt="منيو قصر الملوك - الصفحة الأولى"
                 class="w-full rounded-lg shadow-inner cursor-pointer transition-transform duration-300 hover:scale-[1.01]"
                 onerror="this.onerror=null; this.src='menu1.png'; this.onerror=function(){this.outerHTML='<div class=\'p-6 bg-amber-50 text-amber-900 rounded-lg border border-amber-300 text-sm\'>⚠️ <b>تنبيه هام:</b> لم يتم العثور على صورة المنيو الأولى.<br>يرجى التأكد من وضع صورة المنيو الأولى في نفس المجلد وتسميتها <b>menu1.jpg</b> أو <b>menu1.png</b></div>';};"
                 onclick="openModal(this.src)">
        </div>

        <!-- Menu Image 2 -->
        <div class="bg-white rounded-2xl shadow-xl p-4 border border-amber-200 text-center relative overflow-hidden">
            <h3 class="text-lg font-bold text-[#5C3A21] mb-2">صفحة المنيو (2) - الكريبات والفرايد</h3>
            <img src="menu2.jpg"
                 alt="منيو قصر الملوك - الصفحة الثانية"
                 class="w-full rounded-lg shadow-inner cursor-pointer transition-transform duration-300 hover:scale-[1.01]"
                 onerror="this.onerror=null; this.src='menu2.png'; this.onerror=function(){this.outerHTML='<div class=\'p-6 bg-amber-50 text-amber-900 rounded-lg border border-amber-300 text-sm\'>⚠️ <b>تنبيه هام:</b> لم يتم العثور على صورة المنيو الثانية.<br>يرجى التأكد من وضع صورة المنيو الثانية في نفس المجلد وتسميتها <b>menu2.jpg</b> أو <b>menu2.png</b></div>';};"
                 onclick="openModal(this.src)">
        </div>
    </main>

    <!-- Modal for Fullscreen Image View -->
    <div id="imageModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4" onclick="closeModal()">
        <div class="relative max-w-5xl max-h-full">
            <button class="absolute -top-12 left-0 text-white font-bold bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg shadow-lg">✖ إغلاق</button>
            <img id="modalImg" class="max-h-[85vh] max-w-full rounded-lg shadow-2xl object-contain mx-auto" alt="تكبير المنيو">
        </div>
    </div>

    <!-- Footer / Sticky Call Bar -->
    <footer class="royal-brown text-white mt-8 shadow-inner sticky bottom-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <span class="text-sm font-semibold text-amber-200">للتواصل والطلب من قصر الملوك:</span>
            <div class="flex flex-wrap justify-center gap-3">
                <a href="tel:01101281570" class="royal-gold-bg text-black px-4 py-2 rounded-xl font-bold text-sm shadow-md flex items-center gap-2 hover:bg-amber-400 transition">
                    📞 01101281570
                </a>
                <a href="tel:01101281670" class="royal-gold-bg text-black px-4 py-2 rounded-xl font-bold text-sm shadow-md flex items-center gap-2 hover:bg-amber-400 transition">
                    📞 01101281670
                </a>
            </div>
        </div>
    </footer>

    <!-- JavaScript for Modal -->
    <script>
        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imgSrc;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('indexModal') // safe check
            document.getElementById('imageModal').classList.add('hidden');
        }
    </script>
</body>
</html>
